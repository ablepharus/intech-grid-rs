[workspace]
resolver = "2"
members = ["crates/intech-grid-rs", "crates/gridctl"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["ableph <alex@ableph.net>"]
keywords = ["midi", "grid", "intech", "controller", "hardware"]
categories = ["hardware-support", "command-line-utilities"]

[workspace.dependencies]
intech-grid-rs = { path = "crates/intech-grid-rs" }
serialport = { version = "4", default-features = false }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
